[package]
name = "mimo-code-ui"
version = "0.1.0"
description = "MimoCodeUI — Tauri 2 desktop client for mimo serve"
edition = "2021"

[lib]
name = "mimo_code_ui_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
tauri-plugin-dialog = "2.7.2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
